name: Build Xiaomi Mi 11 Pro (LineageOS 23.2 A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "xiaomi_11pro"
  DEVICE_CODENAME : "mars"

  # Match LineageOS build.config.common (LLVM=1): makes NM/OBJCOPY/AR/STRIP
  # come from llvm. Without this they fall back to the ancient Android GCC 4.9
  # binutils, which also disables CONFIG_RELR and can corrupt the Image.
  CUSTOM_CMDS : "LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  KERNEL_SOURCE : "https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git"
  KERNEL_BRANCH : "lineage-23.2"

  CLANG_SOURCE : "https://github.com/bluegreensea/android_prebuilts_clang_kernel_linux-x86_clang-r563880c.git"
  CLANG_BRANCH : "main"
  # Must match the prebuilt exactly; also used to scope caches so an old
  # toolchain can never be restored through restore-keys fallback.
  CLANG_TAG : "r563880c"
  CLANG_VER : "21.0.0"

  GCC_GNU : false
  # No GNU GCC: LLVM=1 supplies every tool, and with no CROSS_COMPILE the
  # kernel picks the standard aarch64-linux-gnu target (same as LineageOS).
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/lahaina-qgki_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "bakasu" # xxksu, rsuntk , next, bakasu and sukisu

  SUSFS_ENABLE : false
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : true
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineageos_a16"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # AnyKernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into AnyKernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "mi_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "mi11_evox_a16" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "susfs_fixed" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "false" # if u need NoMount.

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "false" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "true" # if u kernel need DTB , but cannot auto generate it. (Only AnyKernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "true" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/xiaomi_QGKI.config,vendor/star_QGKI.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Xiaomi Mi 11 Pro (LineageOS 23.2 A16)
    runs-on: ubuntu-24.04 # u can changed to ubuntu 22.04, and need container set ubuntu-24.04
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 💾 Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ env.SUSFS_ENABLE }}-${{ env.CLANG_TAG }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ env.SUSFS_ENABLE }}-${{ env.CLANG_TAG }}

      - name: 💾 Restore clang toolchain
        uses: actions/cache@v4
        with:
          path: clang-custom
          key: clang-${{ runner.os }}-${{ env.CLANG_TAG }}
          restore-keys: |
            clang-${{ runner.os }}-${{ env.CLANG_TAG }}

      - name: ✅ Verify clang toolchain
        shell: bash
        run: |
          if [ -d clang-custom ]; then
            echo "[+] clang-custom restored from cache, version info:"
            cat clang-custom/AndroidVersion.txt 2>/dev/null | head -3 || true
            if ! grep -q "${{ env.CLANG_VER }}" clang-custom/AndroidVersion.txt 2>/dev/null; then
              echo "[-] Cached clang is not the expected toolchain (${{ env.CLANG_VER }}), removing it."
              rm -rf clang-custom
            fi
          else
            echo "[+] No cached clang, will be cloned by build-env."
          fi

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        if: env.KERNELSU_AUTO_GET == 'true' || env.KERNELSU_SOURCE != ''
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel
          # Nothing

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 📤 Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: mars-build-meta
          path: |
            device_kernel/out/System.map
            device_kernel/out/.config

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: 🗂️ Collect DTBO/DTB files
        shell: bash
        run: |
          DTS=$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot/dts/vendor/qcom
          mkdir -p /tmp/dtfiles
          cp -f $DTS/lahaina.dtb /tmp/dtfiles/ 2>/dev/null || echo "MISS lahaina.dtb"
          cp -f $DTS/mars-sm8350-overlay.dtbo /tmp/dtfiles/ 2>/dev/null || echo "MISS mars dtbo"
          cp -f $DTS/star-sm8350-overlay.dtbo /tmp/dtfiles/ 2>/dev/null || echo "MISS star dtbo"
          cp -f $DTS/venus-sm8350-overlay.dtbo /tmp/dtfiles/ 2>/dev/null || echo "MISS venus dtbo"
          ls -la /tmp/dtfiles/

      - name: 📤 Upload DTBO/DTB files
        uses: actions/upload-artifact@v7
        with:
          name: mars-dt-files
          path: /tmp/dtfiles/

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
